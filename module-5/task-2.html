<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odd or Even</title>
    <style>
      body {
        padding: 50px;
        font-size: large;
      }
      .valid {
        color: green;
      }
      .invalid {
        color: red;
      }
    </style>
  </head>
  <body>
    <label>Enter a number</label>
    <input type="number" id="userInput" />
    <button type="submit" id="checkNumber">Check</button>
    <p id="result" class="valid"></p>
    <script>
      const userInput = document.getElementById("userInput");
      const checkButton = document.getElementById("checkNumber");
      const outputElement = document.getElementById("result");

      checkButton.addEventListener("click", () => {
        let inputNumber = Number(userInput.value);
        if (outputElement.classList.contains("invalid"))
          outputElement.classList.remove("invalid");

        if (userInput.value === "") {
          outputElement.innerHTML = "Please enter a number";
          outputElement.classList.add("invalid");
        } else if (inputNumber === 0) {
          outputElement.innerHTML = "The number is Zero";
        } else if (inputNumber % 2 === 0) {
          outputElement.innerHTML = "The number is Even";
        } else {
          outputElement.innerHTML = "The number is Odd";
        }
      });
    </script>
  </body>
</html>
